      namespace: dev
      level: restricted
      version: v1.36
      modes:
        - enforce
        - audit
        - warn
      runtime_enforcement: NOT RUNTIME-VERIFIED
    identity_project:
      name: golden-path-service-a-identity
      namespaced_resources:
        - core/ServiceAccount
      cluster_resources: []
  applications:
    root:
      path: applications/root
      target_revision: v0.3.0
    service_a:
      path: services/service-a/overlays/dev
      target_revision: v0.3.0
    service_a_identity:
      path: platform/service-accounts/service-a
      target_revision: v0.3.0
