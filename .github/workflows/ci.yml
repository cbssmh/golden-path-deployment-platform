name: platform-ci

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: '3.12.12'
  NODE_VERSION: '22.23.3'
  RUBY_VERSION: '3.3.10'

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # ruby/setup-ruby v1.327.0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
      # actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install checksum-verified binary tools
        run: ./scripts/install-ci-tools.sh
      - name: Install locked validation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            --requirement ci/requirements.txt
          npm ci --ignore-scripts --prefix ci
          markdownlint_bin="${GITHUB_WORKSPACE}/ci/node_modules/.bin"
          printf '%s\n' "${markdownlint_bin}" >>"${GITHUB_PATH}"
      - name: Verify pinned tool versions
        run: |
          actual_python="$(python --version | awk '{print $2}')"
          test "${actual_python}" = "${PYTHON_VERSION}"
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(ruby -e 'print RUBY_VERSION')" = "${RUBY_VERSION}"
          test "$(yamllint --version)" = "yamllint 1.38.0"
          test "$(markdownlint --version)" = "0.49.1"
      - name: Run CI contract
        run: make ci
